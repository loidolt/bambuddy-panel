name: Release

# Pushing a tag like v0.1.0 builds every board with that version and puts the firmware files
# into a draft release. Nothing is public until the draft is published by hand.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Actions pinned to commits; the comment names the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'boards/*.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Unit tests
        run: pio test -e test

      - name: Build and verify the release packages
        run: python3 tools/package_firmware.py --build --tag "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: dist
      - name: Create draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS.txt)
          cat > notes.md <<EOF
          Choose the file matching your [board profile](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/boards.md).
          Use the full image at 0x0 for initial USB installation or recovery. This clears the panel configuration.
          For an existing panel, upload the app image through its settings page to preserve configuration.
          See the [installation guide](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/get-started.md).
          The notices ZIP and rebuildable source archive accompany the firmware.
          EOF
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft "${flags[@]}" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
