name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Actions pinned to commits; the comment names the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO and SDL2
        run: |
          pip install platformio==6.2.0
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libcurl4-openssl-dev

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'boards/*.ini') }}
          restore-keys: pio-${{ runner.os }}-

      # Warnings in the panel's own code fail every build below (-Werror in platformio.ini).
      - name: Unit tests
        run: pio test -e test

      - name: Icons are up to date
        run: |
          python3 tools/make_icons.py
          git diff --exit-code src/icons.c

      - name: Build and verify the firmware packages for every board
        run: python3 tools/package_firmware.py --build

      - name: Rebuild the source archive with a custom OTA profile
        run: |
          work=$(mktemp -d)
          tar -xzf dist/bambuddy-panel-dev-source.tar.gz -C "$work"
          cat >> "$work/platformio_override.ini" <<'EOF'

          [env:custom-panel]
          extends = env:cyd-st7789
          build_flags = ${env:cyd-st7789.build_flags} -DOTA_PASSWORD=\"ci-only-password\"
          EOF
          cp -a --reflink=auto "$HOME/.platformio" "$work/pio-core"
          PLATFORMIO_CORE_DIR="$work/pio-core" pio run --project-dir "$work" -e custom-panel
          image="$work/.pio/build/custom-panel/firmware.bin"
          grep -aFq 'bambuddy-panel-%d' "$image"
          grep -aFq 'bambuddy-panel-board:cyd-st7789;' "$image"

      - name: Simulator screenshots
        run: ./tools/shots.sh

      - name: Screenshots in the README and the docs match the simulator
        run: python3 tools/compare_shots.py docs/screenshots shots README.md docs/*.md

      # The tour behind docs/demo.gif still plays: every button it presses is there. The films
      # themselves are made by hand (tools/demo.sh) and not compared with anything.
      - name: Demo tour plays
        run: ./tools/demo.sh --check

      # The same screens on a bigger panel: fails when a button the screenshots press is gone.
      - name: Simulator screenshots at 480x320
        run: ./tools/shots.sh 480x320

      # The other sizes shown in docs/boards.md, compared with their pictures there.
      - name: Screenshots at the other sizes in the docs
        run: |
          for size in 480x272 800x480; do ./tools/shots.sh $size; done
          for size in 480x320 480x272 800x480; do
            python3 tools/compare_shots.py docs/screenshots/$size shots/$size docs/boards.md
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshots
          path: shots/**/*.png
          if-no-files-found: error
