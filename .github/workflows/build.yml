name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commits; the comment names the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO and SDL2
        run: |
          pip install platformio
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      # Warnings in the panel's own code fail every build below (-Werror in platformio.ini).
      - name: Unit tests
        run: pio test -e test

      - name: Icons are up to date
        run: |
          python3 tools/make_icons.py
          git diff --exit-code src/icons.c

      - name: Firmware, both display variants
        run: pio run -e cyd-st7789 -e cyd-ili9341

      - name: Firmware with updates over WiFi turned on
        env:
          PLATFORMIO_BUILD_FLAGS: -DOTA_PASSWORD=\"ci-only-password\"
        run: pio run -e cyd-st7789 -t clean && pio run -e cyd-st7789

      - name: Firmware without OTA again, for the artifact
        run: pio run -e cyd-st7789 -t clean && pio run -e cyd-st7789

      - name: Simulator screenshots
        run: ./tools/shots.sh

      - name: README screenshots match the simulator
        run: python3 tools/compare_shots.py docs/screenshots shots

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware
          path: .pio/build/cyd-*/firmware.bin

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshots
          path: shots/*.png
