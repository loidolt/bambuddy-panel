; Bambuddy Panel: a small touch display per printer that shows Bambuddy status and a few controls.
; Board: ESP32-2432S028R ("Cheap Yellow Display"), 320x240, resistive touch, no PSRAM.

[platformio]
default_envs = cyd-st7789

; LVGL, configured by flags instead of lv_conf.h. Shared by the panel and the simulator
; so both render the same thing.
[lvgl]
flags =
  -DLV_CONF_SKIP=1
  -DLV_COLOR_DEPTH=16
  -DLV_USE_LOG=0
  -DLV_FONT_MONTSERRAT_14=1
  -DLV_FONT_MONTSERRAT_20=1
  -DLV_FONT_MONTSERRAT_28=1

[esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Two ~1.9 MB app slots so OTA fits alongside LVGL + WiFi.
board_build.partitions = min_spiffs.csv
build_src_filter = +<*> -<sim/>
test_ignore = *
lib_deps =
  lvgl/lvgl@~9.2.2
  bodmer/TFT_eSPI@^2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
  bblanchon/ArduinoJson@^7.2.0
  tzapu/WiFiManager@^2.0.17
build_flags =
  ${lvgl.flags}
  -DLV_MEM_SIZE=49152
  ; --- TFT_eSPI, configured by flags instead of User_Setup.h
  -DUSER_SETUP_LOADED=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DUSE_HSPI_PORT=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=16000000
  ; OTA stays off unless a password is set, e.g. -DOTA_PASSWORD=\"something\"
  ; (put it in a platformio_override.ini or an env var, not in this file)

; The two-USB-port variant.
[env:cyd-st7789]
extends = esp32
build_flags =
  ${esp32.build_flags}
  -DST7789_DRIVER=1
  -DTFT_RGB_ORDER=TFT_BGR
  -DTFT_INVERSION_OFF=1

; The original single-USB variant, kept so the same code runs on either board.
[env:cyd-ili9341]
extends = esp32
build_flags =
  ${esp32.build_flags}
  -DILI9341_2_DRIVER=1

; Desktop simulator: the real ui.cpp in a window, fed with made-up or live printer states.
; Needs SDL2 (macOS: brew install sdl2; Debian/Ubuntu: apt install libsdl2-dev). See README.
[env:sim]
platform = native
build_src_filter = +<ui.cpp> +<icons.c> +<bambuddy_parse.cpp> +<sim/>
test_ignore = *
lib_deps =
  lvgl/lvgl@~9.2.2
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  ${lvgl.flags}
  -DLV_MEM_SIZE=262144
  -DLV_USE_SDL=1
  -Isrc/sim/shim
  ; sdl2-config points at .../include/SDL2; LVGL includes <SDL2/SDL.h>, so step up one folder.
  !echo "$(sdl2-config --cflags | sed 's|/SDL2||g') $(sdl2-config --libs)"

; Unit tests for the parts with no hardware in them: JSON parsing and touch calibration.
;   pio test -e test
[env:test]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<bambuddy_parse.cpp> +<touch_cal.cpp>
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -Isrc/sim/shim
