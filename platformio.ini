; Bambuddy Panel: a small touch display per printer that shows Bambuddy status and a few controls.
;
; This file holds what every build shares. Each board has its own file in boards/, which says
; which panel and touch drivers it uses and on which pins. To add a board: boards/README.md.

[platformio]
default_envs = cyd-st7789
extra_configs =
  boards/*.ini
  ; Your own builds, e.g. with an OTA password. Ignored by git; fine when it doesn't exist.
  platformio_override.ini

; LVGL, configured by flags instead of lv_conf.h. Shared by the panel and the simulator
; so both render the same thing.
[lvgl]
flags =
  -DLV_CONF_SKIP=1
  -DLV_COLOR_DEPTH=16
  -DLV_USE_LOG=0
  ; The setup screens show a QR code to join the panel's network and to open its settings page.
  -DLV_USE_QRCODE=1
  ; The UI's three text sizes on a 320x240 panel. A board with a bigger screen turns on the
  ; sizes it needs as well (boards/README.md); the UI picks from what is built in.
  -DLV_FONT_MONTSERRAT_14=1
  -DLV_FONT_MONTSERRAT_20=1
  -DLV_FONT_MONTSERRAT_28=1

; Every ESP32 board starts from this. The board's file adds `board`, the partition table and
; the drivers below.
[esp32]
platform = espressif32@6.9.0
framework = arduino
platform_packages = platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = +<*> -<sim/>
; Warnings in the panel's own code fail the build (libraries are compiled without these).
build_src_flags = -Wall -Wextra -Werror
test_ignore = *
lib_deps =
  lvgl/lvgl@9.2.2
  bblanchon/ArduinoJson@7.4.3
  tzapu/WiFiManager@2.0.17
build_flags =
  ${lvgl.flags}
  -DLV_MEM_SIZE=65536
  ; LVGL's memory comes from the heap at start-up: a 64 KB static array doesn't fit the
  ; ESP32's static DRAM next to WiFi, and the heap has room to spare once booted.
  -DLV_MEM_POOL_INCLUDE=\"stdlib.h\"
  -DLV_MEM_POOL_ALLOC=malloc
  ; OTA stays off unless a password is set, e.g. -DOTA_PASSWORD=\"something\"
  ; (put it in platformio_override.ini or an env var, not in this file)

; ---- Drivers. A board's file pulls in one panel driver and one touch driver; the code for
; each is in src/drivers/ and is only compiled when its flag is set.

; SPI panels through TFT_eSPI (ILI9341, ST7789, ST7796, ILI9488, ...). The board's file gives
; the chip and the pins as TFT_eSPI's own flags.
[panel_tft_espi]
lib_deps =
  bodmer/TFT_eSPI@2.5.43
build_flags =
  -DPANEL_TFT_ESPI=1
  ; TFT_eSPI is configured by flags instead of User_Setup.h
  -DUSER_SETUP_LOADED=1
  -DDISABLE_ALL_LIBRARY_WARNINGS=1

; Resistive touch, XPT2046. On an SPI bus of its own (TOUCH_CLK/MISO/MOSI), or on the panel's
; with -DTOUCH_SHARES_PANEL_SPI=1. Needs calibration on the device.
[touch_xpt2046]
lib_deps =
  ; v1.4; pinned to the commit, since the library has no registry releases
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#d57f64c8b5f2bc5b8d10d121550806eeff7b06d9
build_flags =
  -DTOUCH_XPT2046=1

; Capacitive touch over I2C (TOUCH_SDA, TOUCH_SCL, optional TOUCH_RST). No library and no
; calibration; the board's file says how the touch grid lies on the screen (TOUCH_SWAP_XY,
; TOUCH_MIRROR_X, TOUCH_MIRROR_Y).
[touch_gt911]
build_flags =
  -DTOUCH_GT911=1

; CST816S, CST820 and relatives.
[touch_cst8xx]
build_flags =
  -DTOUCH_CST8XX=1

; FT6236, FT6336 and relatives.
[touch_ft6x36]
build_flags =
  -DTOUCH_FT6X36=1

; ---- Text sizes for screens bigger than 320x240 (boards/README.md has the table).
[fonts_480x320]
flags =
  -DLV_FONT_MONTSERRAT_18=1
  -DLV_FONT_MONTSERRAT_26=1
  -DLV_FONT_MONTSERRAT_36=1

; ---- Desktop builds

; Desktop simulator: the real ui.cpp in a window, fed with made-up or live printer states.
; Needs SDL2 (macOS: brew install sdl2; Debian/Ubuntu: apt install libsdl2-dev). See README.
[env:sim]
platform = native@1.2.1
build_src_filter = +<ui.cpp> +<ui_tasks.cpp> +<ui_filament.cpp> +<ui_layout.cpp> +<ui_logic.cpp> +<icons.c> +<bambuddy_parse.cpp> +<bambuddy_api.cpp> +<poller.cpp> +<spools.cpp> +<setup_page.cpp> +<fw_check.cpp> +<sim/>
build_src_flags = -Wall -Wextra -Werror
test_ignore = *
lib_deps =
  lvgl/lvgl@9.2.2
  bblanchon/ArduinoJson@7.4.3
build_flags =
  ${lvgl.flags}
  ; More text sizes than any one board has, so --size can show any screen (see README).
  -DLV_FONT_MONTSERRAT_16=1
  -DLV_FONT_MONTSERRAT_18=1
  -DLV_FONT_MONTSERRAT_22=1
  -DLV_FONT_MONTSERRAT_24=1
  -DLV_FONT_MONTSERRAT_26=1
  -DLV_FONT_MONTSERRAT_32=1
  -DLV_FONT_MONTSERRAT_36=1
  -DLV_FONT_MONTSERRAT_40=1
  -DLV_FONT_MONTSERRAT_48=1
  ; The same LVGL memory as the panel, so the simulator runs out where the panel would.
  ; (A 64-bit build needs somewhat more for the same screens, so this errs on the safe side.)
  -DLV_MEM_SIZE=65536
  -DLV_USE_SDL=1
  -lcurl
  -Isrc/sim/shim
  ; sdl2-config points at .../include/SDL2; LVGL includes <SDL2/SDL.h>, so step up one folder.
  !echo "$(sdl2-config --cflags | sed 's|/SDL2||g') $(sdl2-config --libs)"

; Unit tests for the parts with no hardware in them: JSON parsing, the requests, the polling
; round, what the screen shows and offers, touch calibration, and the checks on an uploaded
; firmware file.
;   pio test -e test
[env:test]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_src_filter = +<bambuddy_parse.cpp> +<bambuddy_api.cpp> +<poller.cpp> +<ui_logic.cpp> +<touch_cal.cpp> +<setup_page.cpp> +<fw_check.cpp> +<spools.cpp>
build_src_flags = -Wall -Wextra -Werror
lib_deps =
  bblanchon/ArduinoJson@7.4.3
; AddressSanitizer and UBSan: a write past the end of a Snapshot field, or a value outside its
; type, fails the test instead of passing by luck.
build_flags =
  -Isrc/sim/shim
  -fsanitize=address,undefined
  -fno-sanitize-recover=undefined
  -fno-omit-frame-pointer
  -g
