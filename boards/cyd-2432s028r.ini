; ESP32-2432S028R, the "Cheap Yellow Display": ESP32-WROOM, 2.8" 320x240 SPI panel, resistive
; touch on its own SPI bus, RGB LED on the back, no PSRAM. Sold with either of two display chips.

[cyd-2432s028r]
extends = esp32
board = esp32dev
; Two ~1.9 MB app slots so OTA fits alongside LVGL + WiFi.
board_build.partitions = min_spiffs.csv
lib_deps =
  ${esp32.lib_deps}
  ${panel_tft_espi.lib_deps}
  ${touch_xpt2046.lib_deps}
build_flags =
  ${esp32.build_flags}
  ${panel_tft_espi.build_flags}
  ${touch_xpt2046.build_flags}
  ; --- The screen as the UI sees it: landscape, USB on the right.
  -DSCREEN_W=320
  -DSCREEN_H=240
  -DPANEL_ROTATION=1
  ; --- Panel (TFT_eSPI's flags; its width and height are the panel's own, in portrait)
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DUSE_HSPI_PORT=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=16000000
  ; --- Backlight, dimmed by PWM
  -DBACKLIGHT_PIN=21
  ; --- Touch
  -DTOUCH_CLK=25
  -DTOUCH_MISO=39
  -DTOUCH_MOSI=32
  -DTOUCH_CS=33
  -DTOUCH_IRQ=36
  -DTOUCH_ROTATION=1
  ; Raw readings at the left, right, top and bottom edge: typical for this board, used until
  ; the panel has been calibrated on the device.
  -DTOUCH_CAL_X0=200
  -DTOUCH_CAL_X1=3700
  -DTOUCH_CAL_Y0=240
  -DTOUCH_CAL_Y1=3800
  ; --- RGB status LED on the back, lit when the pin is low
  -DLED_R=4
  -DLED_G=16
  -DLED_B=17
  -DLED_ACTIVE_LOW=1

; The two-USB-port variant.
[env:cyd-st7789]
extends = cyd-2432s028r
build_flags =
  -DBOARD_ENV=\"cyd-st7789\"
  ${cyd-2432s028r.build_flags}
  -DST7789_DRIVER=1
  -DTFT_RGB_ORDER=TFT_BGR
  -DTFT_INVERSION_OFF=1

; The original single-USB variant, kept so the same code runs on either board.
[env:cyd-ili9341]
extends = cyd-2432s028r
build_flags =
  -DBOARD_ENV=\"cyd-ili9341\"
  ${cyd-2432s028r.build_flags}
  -DILI9341_2_DRIVER=1
