; Wireless-Tag WT32-SC01: ESP32-WROVER, 3.5" 480x320 SPI panel (ST7796), capacitive touch
; (FT6336), no status LED.
;
; Pins from openHASP's board definition. Not yet run on the real board with this firmware:
; see boards/README.md.

[env:wt32-sc01]
extends = esp32
board = esp32dev
; Two ~1.9 MB app slots so OTA fits alongside LVGL + WiFi.
board_build.partitions = min_spiffs.csv
lib_deps =
  ${esp32.lib_deps}
  ${panel_tft_espi.lib_deps}
build_flags =
  -DBOARD_ENV=\"wt32-sc01\"
  ${esp32.build_flags}
  ${panel_tft_espi.build_flags}
  ${touch_ft6x36.build_flags}
  ${fonts_480x320.flags}
  ; --- The screen as the UI sees it: landscape. PANEL_ROTATION=3 turns it upside down.
  -DSCREEN_W=480
  -DSCREEN_H=320
  -DPANEL_ROTATION=1
  ; --- Panel (TFT_eSPI's flags; its width and height are the panel's own, in portrait)
  -DST7796_DRIVER=1
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DTFT_MISO=-1
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=21
  -DTFT_RST=22
  -DTFT_BL=23
  -DTFT_BACKLIGHT_ON=HIGH
  -DUSE_HSPI_PORT=1
  -DSPI_FREQUENCY=40000000
  ; --- Backlight, dimmed by PWM
  -DBACKLIGHT_PIN=23
  ; --- Capacitive touch, FT6336 at 0x38; no reset line
  -DTOUCH_SDA=18
  -DTOUCH_SCL=19
  ; The touch grid is the panel's own, in portrait; this lays it on PANEL_ROTATION=1.
  ; (For PANEL_ROTATION=3: TOUCH_MIRROR_X=1 instead of TOUCH_MIRROR_Y.)
  -DTOUCH_SWAP_XY=1
  -DTOUCH_MIRROR_Y=1
