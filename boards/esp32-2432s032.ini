; ESP32-2432S032: ESP32-WROOM, 3.2" 320x240 SPI panel (ST7789, IPS), RGB LED, no PSRAM.
; Sold with resistive touch (R) or capacitive touch (C).
;
; Pins from two public board definitions that agree (rzeldent/platformio-espressif32-sunton and
; openHASP). Not yet run on the real board with this firmware: see boards/README.md.

[esp32-2432s032]
extends = esp32
board = esp32dev
; Two ~1.9 MB app slots so OTA fits alongside LVGL + WiFi.
board_build.partitions = min_spiffs.csv
lib_deps =
  ${esp32.lib_deps}
  ${panel_tft_espi.lib_deps}
build_flags =
  ${esp32.build_flags}
  ${panel_tft_espi.build_flags}
  ; --- The screen as the UI sees it: landscape. PANEL_ROTATION=3 turns it upside down.
  -DSCREEN_W=320
  -DSCREEN_H=240
  -DPANEL_ROTATION=1
  ; --- Panel (TFT_eSPI's flags; its width and height are the panel's own, in portrait)
  -DST7789_DRIVER=1
  -DTFT_RGB_ORDER=TFT_BGR
  ; IPS panel: colours are inverted unless told
  -DTFT_INVERSION_ON=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=27
  -DTFT_BACKLIGHT_ON=HIGH
  -DUSE_HSPI_PORT=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=16000000
  ; --- Backlight, dimmed by PWM
  -DBACKLIGHT_PIN=27
  ; --- RGB status LED on the back, lit when the pin is low
  -DLED_R=4
  -DLED_G=16
  -DLED_B=17
  -DLED_ACTIVE_LOW=1

; Resistive touch (XPT2046).
[env:esp32-2432s032r]
extends = esp32-2432s032
lib_deps =
  ${esp32-2432s032.lib_deps}
  ${touch_xpt2046.lib_deps}
build_flags =
  ${esp32-2432s032.build_flags}
  ${touch_xpt2046.build_flags}
  ; Resistive touch on the panel's SPI bus
  -DTOUCH_SHARES_PANEL_SPI=1
  -DTOUCH_CS=33
  -DTOUCH_IRQ=36
  -DTOUCH_ROTATION=1
  ; Raw readings at the left, right, top and bottom edge: rough starting values, used until
  ; the panel has been calibrated on the device (first boot does that).
  -DTOUCH_CAL_X0=200
  -DTOUCH_CAL_X1=3700
  -DTOUCH_CAL_Y0=240
  -DTOUCH_CAL_Y1=3800

; Capacitive touch (GT911).
[env:esp32-2432s032c]
extends = esp32-2432s032
build_flags =
  ${esp32-2432s032.build_flags}
  ${touch_gt911.build_flags}
  ; Capacitive touch, GT911
  -DTOUCH_SDA=33
  -DTOUCH_SCL=32
  -DTOUCH_RST=25
  ; The touch grid is the panel's own, in portrait; this lays it on PANEL_ROTATION=1.
  ; (For PANEL_ROTATION=3: TOUCH_MIRROR_X=1 instead of TOUCH_MIRROR_Y.)
  -DTOUCH_SWAP_XY=1
  -DTOUCH_MIRROR_Y=1
